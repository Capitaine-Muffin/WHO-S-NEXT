<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffea6d" />
    <title>Who's Next?</title>
    <link rel="stylesheet" href="style.css?v=14" />
  </head>
  <body>
    <main id="jeu">
      <section id="accueil" class="ecran actif">
        <p class="surtitre">LE CONCERT VA COMMENCER</p>
        <h1><img src="assets/logo-vertical.webp" alt="Who's Next ?" /></h1>
        <p class="accroche">Garde le rythme. Trouve qui joue. Ne fais pas de fausse note.</p>

        <label class="champ">
          <span>Ton nom de scène</span>
          <input id="nom-joueur" type="text" maxlength="18" autocomplete="nickname" />
        </label>

        <label class="champ">
          <span>Nombre de musiciens</span>
          <select id="nombre-joueurs">
            <option value="2">2 joueurs</option>
            <option value="3">3 joueurs</option>
            <option value="4" selected>4 joueurs</option>
            <option value="5">5 joueurs</option>
            <option value="6">6 joueurs</option>
            <option value="7">7 joueurs</option>
          </select>
        </label>

        <div class="champ">
          <span>Difficulté de la partie</span>
          <input id="niveau" type="hidden" value="1" />
          <button id="ouvrir-difficulte" class="bouton-difficulte" type="button">
            <strong>Niveau 1 · Sens dessus dessous</strong>
            <small>Les cartes Whootchi entrent en scène</small>
          </button>
        </div>

        <label class="champ">
          <span>Niveau des adversaires</span>
          <select id="niveau-ia">
            <option value="1">Niveau 1 · 55 % de réussite</option>
            <option value="2">Niveau 2 · 60 % de réussite</option>
            <option value="3">Niveau 3 · 65 % de réussite</option>
            <option value="4">Niveau 4 · 70 % de réussite</option>
            <option value="5" selected>Niveau 5 · 75 % de réussite</option>
            <option value="6">Niveau 6 · 80 % de réussite</option>
            <option value="7">Niveau 7 · 85 % de réussite</option>
            <option value="8">Niveau 8 · 90 % de réussite</option>
            <option value="9">Niveau 9 · 95 % de réussite</option>
            <option value="10">Niveau 10 · aucune erreur</option>
          </select>
        </label>

        <button id="jouer" class="primaire">Jouer contre l'IA</button>
      </section>

      <section id="partie" class="ecran" aria-live="polite">
        <header class="barre">
          <button id="quitter" class="icone" aria-label="Quitter la partie">×</button>
          <div>
            <strong id="niveau-affiche">Niveau 0</strong>
            <span id="manche-affiche">Manche 1</span>
          </div>
        </header>

        <div id="table" class="table" aria-label="Table de jeu">
          <div id="joueurs-table"></div>
          <button id="relancer-chrono" class="pendule" aria-label="Relancer immédiatement le minuteur">
            <div class="cadran">
              <i class="aiguille"></i>
              <span id="chrono">14</span>
              <small>SECONDES</small>
            </div>
          </button>
        </div>

        <div class="message" id="message">À toi de jouer !</div>

        <section class="zone-joueur">
          <div class="infos-joueur">
            <span>Ta main</span>
            <span id="notes-joueur">0 fausse note</span>
          </div>
          <div class="main-et-flip">
            <div id="main-joueur" class="main-cartes"></div>
            <button id="flip" class="flip" type="button" aria-pressed="false"><span>↻</span> FLIP</button>
          </div>
        </section>
      </section>

      <dialog id="fin-manche">
        <p class="surtitre" id="fin-surtitre">FAUSSE NOTE</p>
        <h2 id="fin-titre">Oups !</h2>
        <p id="fin-texte"></p>
        <button id="continuer" class="primaire">Continuer</button>
      </dialog>

      <dialog id="choix-sens">
        <p class="surtitre">NOUVEAU TOUR</p>
        <h2>Choisis le sens</h2>
        <p>Quel voisin jouera la première carte ?</p>
        <div class="boutons-sens">
          <button class="primaire" data-sens="1">← Voisin de gauche</button>
          <button class="primaire" data-sens="-1">Voisin de droite →</button>
        </div>
      </dialog>

      <dialog id="difficulte">
        <p class="surtitre">RÈGLES DE LA PARTIE</p>
        <h2>Difficulté</h2>
        <div class="liste-niveaux">
          <button type="button" data-niveau="0"><strong>Échauffement</strong><small>Whoot uniquement</small></button>
          <button type="button" data-niveau="1"><strong>Niveau 1 · Sens dessus dessous</strong><small>Whootchi rejoint la partie</small></button>
          <button type="button" data-niveau="2"><strong>Niveau 2 · Gare au rappel</strong><small>Un joueur ne peut pas rejouer la même carte</small></button>
          <button type="button" data-niveau="3"><strong>Niveau 3 · Jamais trois sans faute</strong><small>Pas de troisième carte identique sur la table</small></button>
        </div>
        <label class="champ chrono-difficulte">
          <span>Temps pour jouer</span>
          <div class="reglage-chrono">
            <input id="duree-chrono" type="number" min="1" max="60" value="14" inputmode="numeric" />
            <span>secondes</span>
          </div>
        </label>
        <button id="valider-difficulte" class="primaire" type="button">C'est parti !</button>
      </dialog>
    </main>
    <script type="module" src="jeu.js?v=15"></script>
  </body>
</html>
